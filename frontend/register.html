<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aegis Health - Register</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-box">
    <h1>Create Account</h1>
    <form id="regForm">
      <label>Full name</label>
      <input type="text" id="full_name" required>
      <label>Email</label>
      <input type="email" id="email" required>
      <label>Password</label>
      <input type="password" id="password" required>
      <!--
        VULN A04/API3: role selector exposed directly in the client. Even if
        removed from the UI, the API still accepts role="admin" in the
        register payload with no server-side allowlist - so hiding this
        field client-side would be a false fix. Left visible here on
        purpose to make the client-trust issue obvious during testing.
      -->
      <label>Role (demo - normally inferred)</label>
      <select id="role">
        <option value="patient">patient</option>
        <option value="doctor">doctor</option>
        <option value="admin">admin</option>
      </select>
      <button type="submit">Register</button>
    </form>
    <p id="err" class="error"></p>
    <p class="hint"><a href="index.html">Back to login</a></p>
  </div>
  <script src="app.js"></script>
  <script>
    document.getElementById('regForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        full_name: document.getElementById('full_name').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        role: document.getElementById('role').value,
      };
      try {
        await api('/api/v2/auth/register', 'POST', body);
        window.location.href = 'index.html';
      } catch (err) {
        document.getElementById('err').textContent = err.message;
      }
    });
  </script>
</body>
</html>
